# =========================
# FRONTEND HTTPS
# =========================
server {
    listen 443 ssl;
    server_name ton-domaine.local;

    ssl_certificate     /etc/nginx/certs/ton-domaine.local.pem;
    ssl_certificate_key /etc/nginx/certs/ton-domaine.local-key.pem;

    # IMPORTANT : ne pas intercepter /api/
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name ton-domaine.local;
    return 301 https://$host$request_uri;
}

# =========================
# BACKEND HTTPS
# =========================
server {
    listen 443 ssl;
    server_name api.ton-domaine.local nginx;   # <--- CRUCIAL

    ssl_certificate     /etc/nginx/certs/api.ton-domaine.local.pem;
    ssl_certificate_key /etc/nginx/certs/api.ton-domaine.local-key.pem;

    root /var/www/html/public;
    index index.php;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass backend:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
    }

    location ~ \.php$ {
        return 404;
    }
}

server {
    listen 80;
    server_name api.ton-domaine.local nginx;
    return 301 https://$host$request_uri;
}