services:
  # =========================
  # Base de données MariaDB
  # =========================
  mariadb:
    image: mariadb:11
    env_file:
      - db/.env
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
  # =========================
  # Backend Symfony
  # =========================
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile.dev
    volumes:
      - ./backend:/var/www/html           # code source pour hot-reload
      - ./backend/public/uploads:/var/www/html/public/uploads # dossiers uploads persistants
    env_file:
      - backend/.env.dev
    depends_on:
      - mariadb
    networks:
      - app-network

  # =========================
  # Frontend Nuxt
  # =========================
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile.dev
    volumes:
      - ./frontend:/app                   # code source pour hot-reload
    env_file:
      - frontend/.env
    ports:
      - "3000:3000"                       # accès frontend dev
    networks:
      - app-network

  # =========================
  # Nginx - reverse proxy pour dev
  # =========================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./backend/public/uploads:/var/www/html/public/uploads
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

# =========================
# Volumes persistants
# =========================
volumes:
  db_data:
    name: monorepo_dev_db_data
  uploads_data:
    name: monorepo_dev_uploads_data

# =========================
# Réseau Docker interne
# =========================
networks:
  app-network:
    driver: bridge
