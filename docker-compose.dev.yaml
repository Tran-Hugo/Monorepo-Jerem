services:
  # =========================
  # Base de données MariaDB
  # =========================
  mariadb:
    image: mariadb:11
    env_file:
      - db/.env
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"

volumes:
  db_data:

