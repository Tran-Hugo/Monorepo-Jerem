services:
  mariadb:
    image: mariadb:11
    restart: always
    env_file:
      - db/.env
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

  backend:
    build: ./backend
    restart: always
    env_file:
      - backend/.env.prod
    depends_on:
      - mariadb
    volumes:
      - uploads_data:/var/www/html/public/uploads
    networks:
      - app-network

  frontend:
    build: ./frontend
    restart: always
    env_file:
      - frontend/.env.prod
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - uploads_data:/var/www/html/public/uploads
      - ./backend/public:/var/www/html/public:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

volumes:
  db_data:
  uploads_data:

networks:
  app-network:
    driver: bridge