services:
  mariadb:
    image: mariadb:11
    restart: always
    env_file:
      - db/.env
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

  backend:
    build: ./backend
    restart: always
    env_file:
      - backend/.env.prod
    depends_on:
      - mariadb
    networks:
      - app-network

  frontend:
    build: ./frontend
    restart: always
    env_file:
      - frontend/.env.prod
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public  # Montee du public pour Nginx
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
