lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'

    token_extractors:
        authorization_header:
            enabled: false
        cookie:
            enabled: true
            name: BEARER

    set_cookies:
        BEARER:
            lifetime: null      # Laisse la durée du token
            samesite: none
            path: /
            domain: '%env(default::COOKIE_DOMAIN)%'
            secure: true
            httpOnly: true